name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Fix android folder if missing
        run: |
          if [! -d "android" ]; then
            flutter create. --platforms=android --project-name malik_pro
          fi
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: malik-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
